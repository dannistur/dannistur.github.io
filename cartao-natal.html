<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cartão de Natal · Danni's Tur</title>
<meta name="description" content="Faça um cartão de Natal da van pra mandar pra família. Vem com a gente!">
<meta property="og:title" content="Cartão de Natal da Danni's Tur 🎄">
<meta property="og:description" content="Coloque o nome do seu filho e mande um cartão de Natal da van pros avós!">
<meta property="og:image" content="https://dannistur.github.io/midia/feliz-natal-capa.jpg">
<meta name="theme-color" content="#11285e">
<link rel="icon" href="icones/favicon-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,600;0,800;1,800;1,900&family=Figtree:wght@400;600;700;800&family=Great+Vibes&display=swap">
<link rel="stylesheet" href="estilo.css?v=37">
<style>
  body{margin:0;background:#0b1a3f;color:#fff}
  .pg{max-width:560px;margin:0 auto;padding:18px 0 40px;display:grid;gap:16px}
  .topo{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .topo a{color:#c9d3ee;text-decoration:none;font-weight:700}
  .topo img{height:34px}
  h1{font:italic 800 30px/1.05 var(--f-display);color:#f3d48a;margin:0}
  .sub{margin:-6px 0 0;color:#c9d3ee}
  form{background:#fff;color:var(--tinta);border-radius:18px;padding:16px;display:grid;gap:14px}
  label.t{font-weight:700;font-size:14px;display:block;margin-bottom:6px}
  input[type=text]{width:100%;font-size:17px;padding:11px 12px;border:1.5px solid var(--linha);border-radius:12px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{position:relative}
  .chip input{position:absolute;opacity:0;pointer-events:none}
  .chip span{display:block;border:2px solid var(--linha);border-radius:999px;padding:7px 14px;font-weight:700;cursor:pointer;background:#fff}
  .chip input:checked + span{border-color:var(--roxo);background:#f6ecf7;color:var(--roxo)}
  .chip input:focus-visible + span{outline:3px solid var(--laranja);outline-offset:2px}
  #outroWrap[hidden]{display:none}
  .prev{position:relative}
  canvas{width:100%;height:auto;display:block;border-radius:14px;box-shadow:0 14px 30px rgba(0,0,0,.45)}
  .bts{display:grid;gap:10px}
  .bts button{font:800 17px var(--f-corpo);border:0;border-radius:14px;padding:15px;cursor:pointer}
  #enviar{background:#1fa855;color:#fff}
  #baixar{background:#f3d48a;color:#3a2a05}
  #msg{margin:0;text-align:center;color:#c9d3ee;font-size:14px;min-height:20px}
</style>
</head>
<body>
<div class="pg">
  <div class="topo"><a href="./">‹ Início</a><img src="img/logo-dannis-branco.png" alt="Danni's Tur"></div>
  <h1>💌 Cartão de Natal da van</h1>
  <p class="sub">Coloque o nome do seu filho e mande um cartão pros avós, pros padrinhos, pra quem você quiser!</p>

  <form id="f" autocomplete="off">
    <div><label class="t" for="nome">Nome da criança</label><input type="text" id="nome" maxlength="40" placeholder="Ex.: Joãozinho"></div>
    <div><label class="t" for="nome2">Tem irmão(ã)? <span style="font-weight:500;color:var(--tinta-2)">(opcional)</span></label><input type="text" id="nome2" maxlength="40" placeholder="Ex.: Maria"></div>
    <div><span class="t">Pra quem é o cartão?</span>
      <div class="chips" id="pra"></div>
      <div id="outroWrap" hidden style="margin-top:8px"><input type="text" id="outro" maxlength="24" placeholder="Ex.: Dinda, Tia Ana…"></div>
    </div>
    <div><span class="t">Com qual tio(a) vai pra escola? <span style="font-weight:500;color:var(--tinta-2)">(opcional)</span></span>
      <div class="chips" id="tio"></div>
    </div>
  </form>

  <div class="prev"><canvas id="cv" width="1080" height="1350" aria-label="Prévia do cartão de Natal"></canvas></div>
  <div class="bts">
    <button type="button" id="enviar">📲 Mandar no WhatsApp</button>
    <button type="button" id="baixar">⬇️ Baixar o cartão</button>
  </div>
  <p id="msg" role="status"></p>
</div>
<script>
(function(){
  const $ = s => document.querySelector(s);
  const PRA = ["Vovó","Vovô","Vovós","Mamãe","Papai","Família","Padrinhos","Outro"];
  const TIOS = ["Nenhum","Tio Daniel","Tia Joyce","Tio Luiz","Tia Cintia"];
  const chip = (nome, v, ok) => `<label class="chip"><input type="radio" name="${nome}" value="${v}"${ok ? " checked" : ""}><span>${v}</span></label>`;
  $("#pra").innerHTML = PRA.map((v, i) => chip("pra", v, i === 0)).join("");
  $("#tio").innerHTML = TIOS.map((v, i) => chip("tio", v, i === 0)).join("");

  const cv = $("#cv"), cx = cv.getContext("2d"), W = 1080, H = 1350;
  const carrega = src => new Promise(ok => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => ok(null); i.src = src; });
  let van = null, logo = null;

  function valor(){
    const p = document.querySelector('input[name=pra]:checked').value;
    const pra = p === "Outro" ? ($("#outro").value.trim() || "Família") : p;
    const n1 = $("#nome").value.trim(), n2 = $("#nome2").value.trim();
    const tio = document.querySelector('input[name=tio]:checked').value;
    return {pra, de: n1 && n2 ? `${n1} e ${n2}` : (n1 || n2 || "Seu netinho"), tio: tio === "Nenhum" ? "" : tio};
  }
  function quebra(txt, larg){
    const ps = txt.split(" "), ls = []; let l = "";
    ps.forEach(p => { const t = l ? l + " " + p : p; if (cx.measureText(t).width > larg && l){ ls.push(l); l = p; } else l = t; });
    if (l) ls.push(l); return ls;
  }
  function cabe(txt, fonte, max, larg){ let s = max; do { cx.font = fonte.replace("§", s); s -= 4; } while (cx.measureText(txt).width > larg && s > 30); }

  function desenha(){
    const v = valor();
    // fundo
    const g = cx.createRadialGradient(W/2, 300, 50, W/2, 500, 1100);
    g.addColorStop(0, "#24468f"); g.addColorStop(.5, "#11285e"); g.addColorStop(1, "#06102b");
    cx.fillStyle = g; cx.fillRect(0, 0, W, H);
    // estrelas e neve fixas
    let s = 11; const rnd = () => (s = (s * 16807) % 2147483647, (s - 1) / 2147483646);
    for (let i = 0; i < 90; i++){ cx.globalAlpha = .3 + rnd() * .6; cx.fillStyle = "#fff"; cx.beginPath(); cx.arc(rnd() * W, rnd() * H, .8 + rnd() * 3, 0, 6.283); cx.fill(); }
    cx.globalAlpha = 1;
    // varal de luzes
    const cores = ["#ff3b3b","#ffd23f","#2fd36b","#3fa0ff","#ff8a1f"];
    cx.strokeStyle = "#1c2a1c"; cx.lineWidth = 4; cx.beginPath();
    for (let x = -10; x <= W + 10; x += 6){ const u = ((x + 10) % 360) / 360, y = 18 + 70 * 4 * u * (1 - u); x === -10 ? cx.moveTo(x, y) : cx.lineTo(x, y); }
    cx.stroke();
    for (let x = 20, i = 0; x < W; x += 52, i++){ const u = ((x + 10) % 360) / 360, y = 18 + 70 * 4 * u * (1 - u) + 16;
      cx.shadowColor = cores[i % 5]; cx.shadowBlur = 22; cx.fillStyle = cores[i % 5]; cx.beginPath(); cx.ellipse(x, y, 10, 15, 0, 0, 6.283); cx.fill(); }
    cx.shadowBlur = 0;
    // títulos
    cx.textAlign = "center"; cx.textBaseline = "alphabetic";
    const ouro = cx.createLinearGradient(0, 180, 0, 520); ouro.addColorStop(0, "#fff3c4"); ouro.addColorStop(.5, "#f1cf78"); ouro.addColorStop(1, "#c9973a");
    cx.fillStyle = ouro; cx.shadowColor = "rgba(255,210,120,.55)"; cx.shadowBlur = 30;
    cx.font = "160px 'Great Vibes'"; cx.fillText("Feliz Natal,", W/2, 270);
    cabe(v.pra + "!", "§px 'Great Vibes'", 175, 900); cx.fillText(v.pra + "!", W/2, 425);
    cx.shadowBlur = 0;
    // mensagem
    cx.fillStyle = "#fff"; cx.font = "600 44px Figtree";
    quebra("Que o nascimento de Jesus encha o seu coração de paz, amor e alegria. 🎄", 860).forEach((l, i) => cx.fillText(l, W/2, 525 + i * 58));
    // assinatura
    cx.fillStyle = "#c9d3ee"; cx.font = "64px 'Great Vibes'"; cx.fillText("Com muito carinho,", W/2, 705);
    cx.fillStyle = "#f3d48a"; cabe(v.de, "italic 900 §px Kanit", 84, 940); cx.fillText(v.de, W/2, 790);
    if (v.tio){ cx.fillStyle = "#dfe7ff"; cx.font = "700 40px Figtree"; cx.fillText(`${v.tio.startsWith("Tia") ? "e a" : "e o"} ${v.tio} 🚐`, W/2, 845); }
    // van e rodapé
    if (van){ const vw = 470, vh = vw * van.height / van.width; cx.shadowColor = "rgba(0,0,0,.5)"; cx.shadowBlur = 30; cx.shadowOffsetY = 18;
      cx.drawImage(van, W/2 - vw/2 + 20, H - vh - 108, vw, vh); cx.shadowBlur = 0; cx.shadowOffsetY = 0; }
    cx.fillStyle = "rgba(255,255,255,.08)"; cx.fillRect(0, H - 100, W, 100);
    if (logo){ const lh = 64, lw = lh * logo.width / logo.height; cx.drawImage(logo, 60, H - 82, lw, lh); }
    cx.textAlign = "right"; cx.fillStyle = "#f3d48a"; cx.font = "italic 900 46px Kanit"; cx.fillText("VEM COM A GENTE!!!", W - 60, H - 34);
    cx.textAlign = "center";
  }

  function arquivo(){ return new Promise(ok => cv.toBlob(b => ok(new File([b], "cartao-natal-dannis-tur.jpg", {type: "image/jpeg"})), "image/jpeg", .92)); }
  function baixa(f){ const u = URL.createObjectURL(f), a = document.createElement("a"); a.href = u; a.download = f.name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 4000); }
  $("#enviar").onclick = async () => {
    const f = await arquivo();
    if (navigator.canShare && navigator.canShare({files: [f]})){
      try { await navigator.share({files: [f], text: "Feliz Natal! 🎄🚐"}); $("#msg").textContent = ""; }
      catch(e){ if (e.name !== "AbortError") { baixa(f); $("#msg").textContent = "Baixei o cartão: é só anexar no WhatsApp pela galeria."; } }
    } else { baixa(f); $("#msg").textContent = "Baixei o cartão: é só anexar no WhatsApp pela galeria."; }
  };
  $("#baixar").onclick = async () => { baixa(await arquivo()); $("#msg").textContent = "Cartão baixado! 🎄"; };

  document.addEventListener("input", desenha);
  document.addEventListener("change", e => { if (e.target.name === "pra") $("#outroWrap").hidden = e.target.value !== "Outro"; desenha(); });
  Promise.all([carrega("img/van-nova.webp"), carrega("img/logo-dannis-branco.png"),
    document.fonts ? Promise.all(["170px 'Great Vibes'", "italic 900 40px Kanit", "600 40px Figtree", "700 40px Figtree"].map(f => document.fonts.load(f).catch(() => null))) : null])
    .then(([v, l]) => { van = v; logo = l; desenha(); });
  desenha();
})();
</script>
</body>
</html>
