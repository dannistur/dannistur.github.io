<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Área dos motoristas · Danni's Tur</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#712473">
<link rel="icon" href="icones/favicon-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,600;0,800;1,700;1,800;1,900&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="estilo.css?v=38">
<style>
body{margin:0}
.pg{max-width:720px;margin:0 auto;padding-block:16px 48px;display:grid;gap:16px}
.topo{display:flex;justify-content:space-between;align-items:center;gap:12px}
.topo a.logo img{width:130px;height:auto;display:block}
.topo h1{font-size:20px;font-style:italic;color:var(--roxo);margin:0;text-align:right;line-height:1.1}
.topo h1 small{display:block;font:600 13px var(--f-corpo);font-style:normal;color:var(--tinta-2)}
.voltar-site{justify-self:start;display:inline-flex;align-items:center;gap:4px;margin-bottom:-6px;padding:9px 16px 9px 12px;border-radius:999px;background:var(--roxo-claro);color:var(--roxo);font:800 15px var(--f-corpo);text-decoration:none}
.voltar-site:active{transform:translateY(1px)}
.login{max-width:420px;margin:24px auto 0;display:grid;gap:12px}
.dica{margin:0;color:var(--tinta-2);font-size:15px}
.rodape{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--tinta-2)}
.rodape button{font:700 14px var(--f-corpo);border:0;background:none;color:var(--roxo);text-decoration:underline;cursor:pointer;padding:8px 0}
</style>
</head>
<body>
<div class="pg">
  <a class="voltar-site" href="./">‹ Voltar ao site</a>
  <header class="topo">
    <a class="logo" href="./"><img src="logo.png" alt="Danni's Tur" width="750" height="160"></a>
    <h1>Área dos motoristas<small>Listas de embarque</small></h1>
  </header>

  <form class="card login" id="fLogin" novalidate hidden>
    <h2 style="font-size:24px;margin:0">Entrar</h2>
    <p class="dica">Daniel, Joyce, Luiz e Cíntia. Entra uma vez e fica conectado neste celular.</p>
    <div class="campo"><label for="senha">Senha dos motoristas</label><input type="password" id="senha" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
    <p class="msg-err" id="loginErr" role="alert"></p>
    <button class="btn btn-pri" type="submit">Entrar</button>
  </form>

  <section id="painel" hidden style="display:grid;gap:16px">
    <div id="listas"></div>
    <div class="rodape"><span id="atual"></span><button type="button" id="sair">Sair deste celular</button></div>
  </section>
</div>

<script src="comum.js?v=20"></script>
<script>
  /* a Área dos motoristas usa o mesmo cartão de listas da Área Danni's, sem o resto */
  (function(){
    const ls = {get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
                set(k, v){ try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch(e){} }};
    window.DT_EMB_MOTORISTA = {
      ancora: document.getElementById("listas"),
      async carregar(){
        const r = await DT.api("mot_listas", {senha: ls.get("dt-mot-senha") || ""});
        ls.set("dt-mot-cache", JSON.stringify(r)); return r;
      },
      async salvar(req){
        const r = await DT.api("mot_salvar", {senha: ls.get("dt-mot-senha") || "", ...req});
        ls.set("dt-mot-cache", JSON.stringify(r)); return r;
      }
    };
  })();
</script>
<script src="embarque-adm.js?v=4"></script>
<script>
(function(){
  "use strict";
  const $ = s => document.querySelector(s);
  const M = window.DT_EMB_MOTORISTA;
  const ls = {get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
              set(k, v){ try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch(e){} }};

  function mostraLogin(msg){ $("#painel").hidden = true; $("#fLogin").hidden = false; $("#loginErr").textContent = msg || ""; $("#senha").focus(); }
  function sai(){ ls.set("dt-mot-senha", null); ls.set("dt-mot-cache", null); M.mostrar({}); }
  async function carrega(){
    $("#fLogin").hidden = true; $("#painel").hidden = false;
    try { const c = JSON.parse(ls.get("dt-mot-cache") || "null"); if (c) M.mostrar(c); } catch(e){}   // mostra a última lista na hora
    $("#atual").textContent = "Atualizando…";
    try { M.mostrar(await M.carregar()); $("#atual").textContent = "Listas atualizadas ✔"; }
    catch(err){
      if (err.codigo === "senha" || err.codigo === "sem_senha"){ sai(); mostraLogin(err.codigo === "senha" ? "A senha mudou. Peça a nova pra Danni's." : err.message); return; }
      $("#atual").textContent = "Sem internet: mostrando a última lista salva.";
    }
  }
  $("#fLogin").addEventListener("submit", async e => {
    e.preventDefault(); const s = $("#senha").value.trim(); $("#loginErr").textContent = "";
    if (!s){ $("#loginErr").textContent = "Digite a senha."; return; }
    const b = $("#fLogin button[type=submit]"); b.disabled = true; b.textContent = "Entrando…";
    try { const r = await DT.api("mot_listas", {senha: s}); ls.set("dt-mot-senha", s); ls.set("dt-mot-cache", JSON.stringify(r)); $("#senha").value = ""; carrega(); }
    catch(err){ $("#loginErr").textContent = err.codigo === "senha" ? "Senha errada." : (err.message || "Não consegui entrar. Confira a internet."); }
    b.disabled = false; b.textContent = "Entrar";
  });
  $("#sair").onclick = () => { if (!confirm("Sair da Área dos motoristas neste celular?")) return; sai(); mostraLogin(); };

  if (ls.get("dt-mot-senha")) carrega(); else mostraLogin();
})();
</script>
</body>
</html>
