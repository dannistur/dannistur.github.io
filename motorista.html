<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Área dos motoristas · Danni's Tur</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#712473">
<link rel="icon" href="icones/favicon-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,600;0,800;1,700;1,800;1,900&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="estilo.css?v=38">
<style>
body{margin:0}
.pg{max-width:720px;margin:0 auto;padding-block:16px 48px;display:grid;gap:16px}
.topo{display:flex;justify-content:space-between;align-items:center;gap:12px}
.topo a.logo img{width:130px;height:auto;display:block}
.topo h1{font-size:20px;font-style:italic;color:var(--roxo);margin:0;text-align:right;line-height:1.1}
.topo h1 small{display:block;font:600 13px var(--f-corpo);font-style:normal;color:var(--tinta-2)}
.login{max-width:420px;margin:24px auto 0;display:grid;gap:12px}
.abas{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#f3e8f3;border-radius:14px;padding:4px}
.abas button{font:800 15px var(--f-corpo);border:0;border-radius:11px;padding:12px 6px;background:transparent;color:var(--roxo);cursor:pointer}
.abas button[aria-selected="true"]{background:#fff;color:var(--roxo);box-shadow:0 2px 0 rgba(0,0,0,.08)}
.fotos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 12px}
@media (min-width:600px){.fotos{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tio{display:grid;justify-items:center;gap:8px;text-align:center;text-decoration:none;color:var(--tinta)}
.foto{position:relative;display:block;width:min(100%,150px);aspect-ratio:1;border-radius:50%;padding:5px;background:#1fa855;box-shadow:0 6px 0 #137a3c}
.tio.vazio .foto{background:#c9bcc9;box-shadow:0 6px 0 #a597a5}
.foto img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;background:#fff}
.tio:active .foto{transform:translateY(3px);box-shadow:0 3px 0 #137a3c}
.n{position:absolute;right:0;bottom:2px;min-width:38px;height:38px;padding:0 8px;border-radius:999px;background:#fff;color:#137a3c;border:3px solid #1fa855;font:800 17px/32px var(--f-display);text-align:center}
.tio.vazio .n{color:#7a6a7a;border-color:#c9bcc9}
.tio b{font:800 19px/1.1 var(--f-display)}
.tio small{color:var(--tinta-2);font-size:13px;margin-top:-4px}
.dica{margin:0;color:var(--tinta-2);font-size:15px}
.rodape{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--tinta-2)}
.rodape button{font:700 14px var(--f-corpo);border:0;background:none;color:var(--roxo);text-decoration:underline;cursor:pointer;padding:8px 0}
</style>
</head>
<body>
<div class="pg">
  <header class="topo">
    <a class="logo" href="./"><img src="logo.png" alt="Danni's Tur" width="750" height="160"></a>
    <h1>Área dos motoristas<small>Listas de embarque</small></h1>
  </header>

  <form class="card login" id="fLogin" novalidate hidden>
    <h2 style="font-size:24px;margin:0">Entrar</h2>
    <p class="dica">Daniel, Joyce, Luiz e Cíntia. Entra uma vez e fica conectado neste celular.</p>
    <div class="campo"><label for="senha">Senha dos motoristas</label><input type="password" id="senha" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
    <p class="msg-err" id="loginErr" role="alert"></p>
    <button class="btn btn-pri" type="submit">Entrar</button>
  </form>

  <section id="painel" hidden style="display:grid;gap:16px">
    <div class="abas" role="tablist">
      <button type="button" role="tab" data-m="semana">📅 Rota da semana</button>
      <button type="button" role="tab" data-m="cinema">🎬 Cinema</button>
    </div>
    <p class="dica" id="dica">Toque na sua foto pra abrir a lista.</p>
    <div class="fotos" id="fotos"></div>
    <p class="msg-err" id="painelErr" role="alert"></p>
    <div class="rodape"><span id="atual"></span><button type="button" id="sair">Sair deste celular</button></div>
  </section>
</div>

<script src="comum.js?v=20"></script>
<script>
(function(){
  "use strict";
  const $ = s => document.querySelector(s);
  const {api, esc} = DT;
  const VANS = [
    {nome: "Tio Daniel", foto: "img/tio-daniel.jpg"},
    {nome: "Tia Joyce",  foto: "img/tia-joyce.jpg"},
    {nome: "Tio Luiz",   foto: "img/tio-luiz.jpg"},
    {nome: "Tia Cintia", foto: "img/tia-cintia.jpg"}
  ];
  const DIAS = ["seg","ter","qua","qui","sex"];
  const ls = {get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
              set(k, v){ try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch(e){} }};
  let senha = ls.get("dt-mot-senha") || "", modo = ls.get("dt-mot-modo") || "semana", cine = {}, semana = {};
  try { const c = JSON.parse(ls.get("dt-mot-cache") || "null"); if (c){ cine = c.vans || {}; semana = c.semana || {}; } } catch(e){}

  /* ---------- link da tela de embarque (mesmo formato da Área Danni's) ---------- */
  const b64 = obj => { const bytes = new TextEncoder().encode(JSON.stringify(obj)); let bin = ""; bytes.forEach(b => bin += String.fromCharCode(b)); return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); };
  const qtd = v => modo === "cinema"
    ? ((cine[v.nome] && cine[v.nome].l.length) || 0)
    : new Set(Object.values((semana[v.nome] && semana[v.nome].dias) || {}).flat().map(a => a[0] + "|" + a[1])).size;
  function linkDe(v){
    if (modo === "cinema"){
      const c = cine[v.nome]; if (!c || !c.l || !c.l.length) return "";
      return "embarque.html#d=" + b64({t: v.nome, e: "Passeio do Cinema · 28/11", l: c.l.map(a => [a[0], a[1] || "", "", a[2] || ""])}) + "&m=1";
    }
    const s = semana[v.nome]; if (!s || !s.dias) return "";
    const k = [], idx = new Map(), d = {};
    DIAS.forEach(dia => { const l = s.dias[dia]; if (!l || !l.length) return;
      d[dia] = l.map(a => { const ch = a[0] + "|" + (a[1] || "") + "|" + (a[2] || ""); if (!idx.has(ch)){ idx.set(ch, k.length); k.push([a[0], a[1] || "", a[2] || ""]); } return idx.get(ch); }); });
    return k.length ? "embarque.html#d=" + b64({t: v.nome, e: "Rota da semana", k, d}) + "&m=1" : "";
  }

  function desenha(){
    document.querySelectorAll(".abas button").forEach(b => b.setAttribute("aria-selected", b.dataset.m === modo));
    $("#dica").textContent = modo === "cinema" ? "Toque na sua foto pra abrir a lista do cinema." : "Toque na sua foto pra abrir a rota. Dentro, as setas ‹ › trocam o dia.";
    $("#fotos").innerHTML = VANS.map(v => {
      const n = qtd(v), link = linkDe(v);
      return `<a class="tio${n ? "" : " vazio"}" href="${link || "#"}" data-vazio="${n ? "" : "1"}" aria-label="${n ? `Abrir a lista da van ${esc(v.nome)}, ${n} crianças` : `A van ${esc(v.nome)} ainda não tem lista`}">
        <span class="foto"><img src="${v.foto}" alt=""><span class="n">${n || "–"}</span></span>
        <b>${esc(v.nome)}</b><small>${n ? `${n} criança${n > 1 ? "s" : ""}` : "sem lista ainda"}</small></a>`;
    }).join("");
  }
  $("#fotos").addEventListener("click", e => {
    const a = e.target.closest(".tio"); if (a && a.dataset.vazio){ e.preventDefault(); $("#painelErr").textContent = "Essa van ainda não tem lista. A Danni's monta na Área Danni's."; }
  });
  document.querySelectorAll(".abas button").forEach(b => b.onclick = () => { modo = b.dataset.m; ls.set("dt-mot-modo", modo); $("#painelErr").textContent = ""; desenha(); });

  /* ---------- entrar (uma vez) e atualizar as listas ---------- */
  function mostraLogin(msg){ $("#painel").hidden = true; $("#fLogin").hidden = false; $("#loginErr").textContent = msg || ""; $("#senha").focus(); }
  async function carrega(){
    $("#fLogin").hidden = true; $("#painel").hidden = false; desenha();
    $("#atual").textContent = "Atualizando…";
    try {
      const r = await api("mot_listas", {senha});
      cine = r.vans || {}; semana = r.semana || {};
      ls.set("dt-mot-cache", JSON.stringify({vans: cine, semana}));
      $("#atual").textContent = "Listas atualizadas ✔"; desenha();
    } catch(err){
      if (err.codigo === "senha" || err.codigo === "sem_senha"){ ls.set("dt-mot-senha", null); ls.set("dt-mot-cache", null); cine = {}; semana = {}; senha = "";
        mostraLogin(err.codigo === "senha" ? "A senha mudou. Peça a nova pra Danni's." : err.message); return; }
      $("#atual").textContent = "Sem internet: mostrando a última lista salva.";
    }
  }
  $("#fLogin").addEventListener("submit", async e => {
    e.preventDefault(); const s = $("#senha").value.trim(); $("#loginErr").textContent = "";
    if (!s){ $("#loginErr").textContent = "Digite a senha."; return; }
    const b = $("#fLogin button[type=submit]"); b.disabled = true; b.textContent = "Entrando…";
    try { const r = await api("mot_listas", {senha: s}); senha = s; ls.set("dt-mot-senha", s); cine = r.vans || {}; semana = r.semana || {}; ls.set("dt-mot-cache", JSON.stringify({vans: cine, semana})); $("#senha").value = ""; carrega(); }
    catch(err){ $("#loginErr").textContent = err.codigo === "senha" ? "Senha errada." : (err.message || "Não consegui entrar. Confira a internet."); }
    b.disabled = false; b.textContent = "Entrar";
  });
  $("#sair").onclick = () => { if (!confirm("Sair da Área dos motoristas neste celular?")) return; ls.set("dt-mot-senha", null); ls.set("dt-mot-cache", null); senha = ""; cine = {}; semana = {}; mostraLogin(); };

  if (senha) carrega(); else mostraLogin();
})();
</script>
</body>
</html>
