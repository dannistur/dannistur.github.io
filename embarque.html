<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#712473">
<meta name="robots" content="noindex">
<title>Embarque · Danni's Tur</title>
<link rel="icon" href="icone.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@600;800&family=Kanit:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root{--roxo:#712473;--verde:#1fa855;--verde-esc:#137a3c;--verm:#d93025;--verm-esc:#9e1b13;--fundo:#f6f1f6;--tinta:#1d1320}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--fundo);color:var(--tinta);font-family:Figtree,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
  header{position:sticky;top:0;z-index:2;background:var(--roxo);color:#fff;padding:12px 16px 14px;padding-top:max(12px,env(safe-area-inset-top));box-shadow:0 4px 0 rgba(0,0,0,.15)}
  .linha{display:flex;align-items:center;justify-content:space-between;gap:10px}
  h1{margin:0;font:800 24px/1.1 Kanit,system-ui,sans-serif}
  h1 small{display:block;font:600 14px Figtree,system-ui,sans-serif;opacity:.85}
  .placar{text-align:right;font:800 30px/1 Kanit,system-ui,sans-serif;white-space:nowrap}
  .placar small{display:block;font:600 13px Figtree,system-ui,sans-serif;opacity:.85}
  .barra{margin-top:10px;height:10px;border-radius:99px;background:rgba(255,255,255,.25);overflow:hidden}
  .barra i{display:block;height:100%;width:0;background:#ffd23f;transition:width .25s}
  main{padding:14px 12px 120px;display:grid;gap:12px;grid-template-columns:1fr;max-width:980px;margin:0 auto}
  @media (min-width:700px){main.c1{grid-template-columns:1fr 1fr}}
  /* 2 ou 3 colunas: botões em pé, mais crianças na tela de uma vez */
  main.c2{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding-inline:10px}
  main.c3{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding-inline:8px}
  main.c2 .aluno,main.c3 .aluno{flex-direction:column;align-items:flex-start;gap:6px;min-height:118px;padding:10px 10px 12px;border-radius:16px}
  main.c2 .num,main.c3 .num{width:30px;height:30px;font-size:15px}
  main.c2 .nome{font-size:clamp(18px,5.6vw,26px)}
  main.c3 .nome{font-size:clamp(14px,4.3vw,20px)}
  main.c2 .esc{font-size:13px;line-height:1.25}
  main.c3 .esc{font-size:11.5px;line-height:1.25}
  main.c2 .estado{margin-top:6px;font-size:11px;padding:4px 8px}
  main.c3 .estado{margin-top:5px;font-size:10px;padding:3px 7px}
  main.c2 .tel,main.c3 .tel{width:32px;height:32px;font-size:15px}
  .aluno{position:relative;display:flex;align-items:center;gap:14px;width:100%;min-height:96px;border:0;border-radius:20px;padding:14px 16px;text-align:left;cursor:pointer;
    background:var(--verde);color:#fff;box-shadow:0 6px 0 var(--verde-esc);transition:transform .08s,background .15s,box-shadow .15s;user-select:none}
  .aluno:active{transform:translateY(3px);box-shadow:0 3px 0 var(--verde-esc)}
  .aluno{-webkit-touch-callout:none;-webkit-user-select:none}
  .aluno.arrastando{transform:scale(1.06) rotate(-1.5deg)!important;box-shadow:0 14px 28px rgba(0,0,0,.35)!important;z-index:3;outline:4px solid #ffd23f;outline-offset:2px}
  body.modo-arrastar .aluno:not(.arrastando){opacity:.75}
  body.modo-arrastar{overscroll-behavior:none}
  .dica-arrastar{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 10px);transform:translateX(-50%);z-index:6;background:#1d1320;color:#fff;font:800 14px Figtree,system-ui,sans-serif;padding:9px 16px;border-radius:999px;box-shadow:0 6px 18px rgba(0,0,0,.3);white-space:nowrap}
  .dica-arrastar[hidden]{display:none}
  .aluno.pegou{background:var(--verm);box-shadow:0 6px 0 var(--verm-esc)}
  .aluno.pegou:active{box-shadow:0 3px 0 var(--verm-esc)}
  .num{flex:none;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.22);font:800 20px Kanit,system-ui,sans-serif}
  .txt{flex:1;min-width:0}
  .nome{display:block;font:800 clamp(24px,7.2vw,34px)/1.05 Kanit,system-ui,sans-serif;text-transform:uppercase;overflow-wrap:break-word;hyphens:none}
  .esc{display:block;margin-top:4px;font:600 15px Figtree,system-ui,sans-serif;opacity:.92}
  .estado{display:inline-block;margin-top:8px;font:800 13px Figtree,system-ui,sans-serif;letter-spacing:.04em;background:rgba(0,0,0,.2);border-radius:99px;padding:5px 10px;white-space:nowrap}
  .tel{flex:none;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:#fff;color:var(--tinta);text-decoration:none;font-size:20px}
  footer{position:fixed;left:0;right:0;bottom:0;z-index:2;display:flex;gap:10px;justify-content:center;padding:12px 16px;padding-bottom:max(12px,env(safe-area-inset-bottom));background:rgba(246,241,246,.96);border-top:1px solid #e3d6e3}
  footer button{font:800 15px Figtree,system-ui,sans-serif;border-radius:999px;padding:11px 14px;border:2px solid var(--roxo);background:#fff;color:var(--roxo);cursor:pointer;white-space:nowrap}
  .cols{display:flex;align-items:center;gap:4px;font:800 13px Figtree,system-ui,sans-serif;color:var(--roxo)}
  .cols button{width:40px;padding:9px 0;text-align:center}
  .cols button[aria-pressed="true"]{background:var(--roxo);color:#fff}
  .vazio{grid-column:1/-1;background:#fff;border-radius:20px;padding:28px 20px;text-align:center;font-size:18px}
  /* rota da semana: dia, não vai */
  .voltar{display:inline-flex;align-items:center;margin:-2px 0 8px;padding:7px 14px 7px 10px;border-radius:999px;background:rgba(255,255,255,.18);color:#fff;font:800 15px Figtree,system-ui,sans-serif;text-decoration:none}
  .dias{display:flex;align-items:center;gap:8px;margin-top:10px}
  .dias[hidden]{display:none}
  .dias .seta{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:#fff;font:800 26px/1 Kanit,system-ui,sans-serif;cursor:pointer}
  .dias .seta:disabled{opacity:.3}
  .dia-atual{flex:1;text-align:center}
  .dia-atual b{display:block;font:800 22px/1.05 Kanit,system-ui,sans-serif;text-transform:uppercase}
  .bolinhas{display:flex;justify-content:center;gap:5px;margin-top:5px}
  .bolinhas button{border:0;border-radius:999px;padding:3px 8px;font:800 11px Figtree,system-ui,sans-serif;background:rgba(255,255,255,.18);color:#fff;cursor:pointer}
  .bolinhas button[aria-current="true"]{background:#ffd23f;color:var(--roxo)}
  .aluno.naovai{background:#9a8f9a;box-shadow:0 6px 0 #6f646f}
  .aluno.naovai .nome{text-decoration:line-through;text-decoration-thickness:3px}
  .acoes-a{flex:none;display:flex;gap:6px}
  main.c2 .acoes-a,main.c3 .acoes-a{position:absolute;top:8px;right:8px;gap:4px}
  main.c2 .acoes-a .tel,main.c3 .acoes-a .tel,main.c2 .acoes-a .falta,main.c3 .acoes-a .falta{position:static}
  .falta{display:inline-flex;align-items:center;height:36px;padding:0 12px;border-radius:999px;background:#fff;color:#5b4d5e;font:800 13px Figtree,system-ui,sans-serif;cursor:pointer;white-space:nowrap}
  main.c2 .falta,main.c3 .falta{height:26px;padding:0 8px;font-size:10.5px}
  .aluno.naovai .falta{background:#1fa855;color:#fff}
  .dia-atual .prox{display:block;font:800 11px Figtree,system-ui,sans-serif;color:#ffd23f;letter-spacing:.06em;text-transform:uppercase}
  .fundo-dlg{position:fixed;inset:0;z-index:5;background:rgba(30,10,35,.55);display:grid;place-items:end center;padding:16px}
  .dlg{width:min(100%,460px);background:#fff;border-radius:22px;padding:18px 16px 16px;display:grid;gap:12px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
  .dlg h2{margin:0;font:800 22px/1.15 Kanit,system-ui,sans-serif}
  .dlg p{margin:0;font-size:15px;color:#5b4d5e}
  .dlg .chips{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
  .dlg .chips button{border:2px solid #cbbccb;border-radius:14px;padding:12px 0;background:#fff;font:800 15px Figtree,system-ui,sans-serif;color:var(--tinta);cursor:pointer}
  .dlg .chips button[aria-pressed="true"]{background:#9a8f9a;border-color:#6f646f;color:#fff}
  .dlg .chips button:disabled{opacity:.3}
  .dlg .bts{display:flex;gap:8px;justify-content:flex-end}
  .dlg .bts button{font:800 16px Figtree,system-ui,sans-serif;border-radius:999px;padding:12px 18px;border:2px solid var(--roxo);background:#fff;color:var(--roxo);cursor:pointer}
  .dlg .bts .ok{background:var(--roxo);color:#fff}
  .pronto{grid-column:1/-1;background:#fff8d6;border:2px solid #f0c419;border-radius:20px;padding:14px 16px;text-align:center;font:800 20px Kanit,system-ui,sans-serif}
</style>
</head>
<body>
<header>
  <a class="voltar" id="voltar" href="motorista.html">‹ Voltar</a>
  <div class="linha">
    <h1 id="tit">Embarque<small id="sub">Passeio do Cinema</small></h1>
    <div class="placar"><span id="cont">0/0</span><small id="contSub">já pegos</small></div>
  </div>
  <div class="dias" id="dias" hidden>
    <button type="button" class="seta" id="antes" aria-label="Dia anterior">‹</button>
    <div class="dia-atual"><b id="diaNome">Segunda</b><div class="bolinhas" id="bolinhas"></div></div>
    <button type="button" class="seta" id="depois" aria-label="Próximo dia">›</button>
  </div>
  <div class="barra"><i id="barra"></i></div>
</header>
<main id="lista"></main>
<div class="dica-arrastar" id="dicaArrastar" hidden>Arraste pro lugar certo e solte ✋</div>
<footer>
  <button type="button" id="recomecar">↺ Recomeçar</button>
  <div class="cols" role="group" aria-label="Colunas">Colunas <button type="button" data-c="1">1</button><button type="button" data-c="2">2</button><button type="button" data-c="3">3</button></div>
</footer>
<script>
(function(){
  "use strict";
  const $ = s => document.querySelector(s);
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const ls = {get(k, pad){ try { const v = localStorage.getItem(k); return v == null ? pad : JSON.parse(v); } catch(e){ return pad; } },
              set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }};
  /* a lista vem no próprio link (depois do #), gerado pela Área Danni's */
  let dados = null;
  try {
    const b = (location.hash.match(/[#&]d=([^&]+)/) || [])[1];
    const bin = atob(b.replace(/-/g, "+").replace(/_/g, "/"));
    dados = JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))));
  } catch(e){}
  const SEMANA = !!(dados && dados.k && dados.d);
  if (!dados || !(Array.isArray(dados.l) || SEMANA)){
    $("#lista").innerHTML = `<div class="vazio">Link incompleto 😕<br><small>Peça o link da lista de embarque de novo pra Danni's Tur.</small></div>`;
    $("footer").hidden = true; return;
  }
  document.title = `Embarque · ${dados.t || "Danni's Tur"}`;
  /* ‹ Voltar: da Área dos motoristas volta pra ela; da Área Danni's volta pra ela; link do WhatsApp vai pra Área dos motoristas */
  $("#voltar").addEventListener("click", e => {
    if (/[#&]m=1\b/.test(location.hash)) return;                            // segue o link pra motorista.html
    e.preventDefault();
    if (history.length > 1 && document.referrer && new URL(document.referrer).origin === location.origin){ history.back(); return; }
    location.href = "motorista.html";
  });
  $("#tit").firstChild.textContent = `🚐 ${dados.t || "Embarque"}`;
  $("#sub").textContent = dados.e || (SEMANA ? "Rota da semana" : "Passeio do Cinema");
  const hash = arr => { let h = 0; for (const c of JSON.stringify(arr)) h = (h * 31 + c.charCodeAt(0)) | 0; return (h >>> 0).toString(36); };

  /* ---------- rota da semana: dia escolhido, semana atual (sábado e domingo já mostram a semana que vem → zera no domingo) ---------- */
  const DIAS = [["seg","Segunda"],["ter","Terça"],["qua","Quarta"],["qui","Quinta"],["sex","Sexta"]];
  const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  const hoje = new Date(); hoje.setHours(12, 0, 0, 0);
  const dow = hoje.getDay();                                     // 0 dom … 6 sáb
  /* duas semanas na tela: esta (posições 0–4) e a próxima (5–9). No domingo a semana que passou some e a próxima vira "esta". */
  const seg0 = new Date(hoje); seg0.setDate(hoje.getDate() + (dow === 0 ? 1 : 1 - dow));   // sábado ainda é esta semana; domingo já é a próxima
  const segDa = w => { const d = new Date(seg0); d.setDate(seg0.getDate() + 7 * w); return d; };
  const dataDo = p => { const d = new Date(seg0); d.setDate(seg0.getDate() + Math.floor(p / 5) * 7 + p % 5); return d; };
  const diasComLista = SEMANA ? DIAS.map((d, i) => i).filter(i => (dados.d[DIAS[i][0]] || []).length) : [];
  const posicoes = SEMANA ? [0, 1].flatMap(w => diasComLista.map(d => w * 5 + d)) : [];
  let pos = !SEMANA ? 0 : (dow >= 1 && dow <= 5 && diasComLista.includes(dow - 1)) ? dow - 1
          : dow === 6 ? (diasComLista[diasComLista.length - 1] || 0) : (diasComLista[0] || 0);
  const sem = () => SEMANA ? Math.floor(pos / 5) : 0;

  /* o que fica guardado neste celular */
  const PREF = SEMANA ? `dt-emb-sem-${hash([dados.t, dados.k.map(a => a[0])])}-` : "";
  const CHAVES = SEMANA ? [PREF + iso(segDa(0)), PREF + iso(segDa(1))] : ["dt-embarque-" + hash([dados.t, dados.e, dados.l.map(a => a[0])])];
  const ests = CHAVES.map(k => ls.get(k, SEMANA ? {p: {}, f: {}} : []));
  if (SEMANA){                                                  // apaga as semanas que já passaram desta van
    try { Object.keys(localStorage).filter(k => k.startsWith(PREF) && k.slice(PREF.length) < iso(segDa(0))).forEach(k => localStorage.removeItem(k)); } catch(e){}
    ests.forEach(e => { e.p = e.p || {}; e.f = e.f || {}; });
  }
  let est = ests[sem()];
  const salva = () => { ests[sem()] = est; ls.set(CHAVES[sem()], est); };
  const diaK = () => DIAS[pos % 5][0];
  const pegosDia = () => new Set(SEMANA ? (est.p[diaK()] || []) : est);
  const naoVai = i => SEMANA && (est.f[i] || []).includes(diaK());
  const listaBase = () => SEMANA ? (dados.d[diaK()] || []).map(i => ({i, a: dados.k[i]})) : dados.l.map((a, i) => ({i, a: [a[0], [a[1], a[2]].filter(Boolean).join(" · "), a[3]]}));
  /* ordem que o motorista arrumou segurando e arrastando (fica neste celular; vale toda semana) */
  const CH_ORDEM = "dt-emb-ordem-" + hash([dados.t, dados.e || "", SEMANA ? dados.k.map(a => a[0]) : dados.l.map(a => a[0])]);
  let ordens = ls.get(CH_ORDEM, {});
  const chOrdem = () => SEMANA ? diaK() : "x";
  const listaDia = () => {
    const l = listaBase(), o = ordens[chOrdem()]; if (!Array.isArray(o)) return l;
    const pos = new Map(o.map((i, k) => [i, k]));
    return l.map((x, k) => ({x, k})).sort((a, b) => (pos.has(a.x.i) ? pos.get(a.x.i) : 1e3 + a.k) - (pos.has(b.x.i) ? pos.get(b.x.i) : 1e3 + b.k)).map(y => y.x);
  };

  function desenha(){
    const lista = listaDia(), pegos = pegosDia();
    const vao = lista.filter(x => !naoVai(x.i)), p = vao.filter(x => pegos.has(x.i)).length, nao = lista.length - vao.length;
    $("#cont").textContent = `${p}/${vao.length}`;
    $("#contSub").textContent = nao ? `já pegos · ${nao} não ${nao > 1 ? "vão" : "vai"}` : "já pegos";
    $("#barra").style.width = vao.length ? (p / vao.length * 100) + "%" : "0";
    if (SEMANA){
      $("#dias").hidden = false;
      const d = dataDo(pos), w = sem();
      $("#diaNome").innerHTML = `${DIAS[pos % 5][1]} · ${String(d.getDate()).padStart(2, "0")}/${String(d.getMonth() + 1).padStart(2, "0")}${w ? `<small class="prox">próxima semana</small>` : ""}`;
      $("#bolinhas").innerHTML = DIAS.map(([k, n], i) => `<button type="button" data-dia="${w * 5 + i}" aria-current="${w * 5 + i === pos}"${diasComLista.includes(i) ? "" : " disabled"}>${n.slice(0, 3).toUpperCase()}</button>`).join("");
      $("#antes").disabled = !posicoes.some(p => p < pos); $("#depois").disabled = !posicoes.some(p => p > pos);
    }
    $("#lista").innerHTML = (!lista.length ? `<div class="vazio">Ninguém na lista deste dia.</div>` : "")
      + (p === vao.length && vao.length ? `<div class="pronto">🎉 Todos pegos!${SEMANA ? "" : " Bora pro cinema!"}</div>` : "")
      + lista.map((x, pos) => {
        const [nome, ref, tel] = x.a, foi = pegos.has(x.i), nv = naoVai(x.i);
        return `<button type="button" class="aluno${nv ? " naovai" : foi ? " pegou" : ""}" data-i="${x.i}" aria-pressed="${foi}">
          <span class="num">${pos + 1}</span>
          <span class="txt"><span class="nome">${esc(nome)}</span><span class="esc">${esc(ref)}</span><span class="estado">${nv ? "NÃO VAI" : foi ? "🔴 PEGOU ✔" : "🟢 FALTA PEGAR"}</span></span>
          <span class="acoes-a">${SEMANA ? `<span class="falta" role="button" tabindex="0" data-f="${x.i}" aria-label="Marcar dias que ${esc(nome)} não vai">Não vai</span>` : ""}${tel ? `<a class="tel" href="tel:+55${esc(tel)}" title="Ligar pro responsável" aria-label="Ligar pro responsável de ${esc(nome)}">📞</a>` : ""}</span>
        </button>`;
      }).join("");
  }
  /* ---------- segurar e arrastar pra mudar a ordem ---------- */
  let arr = null, segura = null, ignoraClique = false;
  const tiraSegura = () => { if (segura){ clearTimeout(segura.t); segura = null; } };
  $("#lista").addEventListener("pointerdown", e => {
    const el = e.target.closest(".aluno"); if (!el || e.button > 0) return;
    tiraSegura();
    segura = {el, x: e.clientX, y: e.clientY, id: e.pointerId, t: setTimeout(() => comeca(el, segura), 450)};
  });
  function comeca(el, s){
    if (!s) return;
    arr = {el, x: s.x, y: s.y}; segura = null;
    el.classList.add("arrastando"); document.body.classList.add("modo-arrastar");
    if (navigator.vibrate) navigator.vibrate(40);
    $("#dicaArrastar").hidden = false;
  }
  const rolaBorda = () => { if (!arr) return; const y = arr.y; if (y < 140) window.scrollBy(0, -12); else if (y > innerHeight - 110) window.scrollBy(0, 12); arr.raf = requestAnimationFrame(rolaBorda); };
  function move(x, y){
    if (segura && Math.hypot(x - segura.x, y - segura.y) > 10) tiraSegura();   // mexeu antes de segurar: é rolagem
    if (!arr) return;
    arr.x = x; arr.y = y;
    if (!arr.raf) arr.raf = requestAnimationFrame(rolaBorda);
    const alvo = document.elementFromPoint(x, y);
    const outro = alvo && alvo.closest(".aluno");
    if (!outro || outro === arr.el) return;
    const r = outro.getBoundingClientRect(), L = $("#lista");
    const depois = (y > r.top + r.height / 2 && x > r.left) || x > r.left + r.width / 2;
    L.insertBefore(arr.el, depois ? outro.nextSibling : outro);
  }
  document.addEventListener("pointermove", e => { if (e.pointerType !== "touch") move(e.clientX, e.clientY); });
  document.addEventListener("touchmove", e => {                // no celular: o toque manda; enquanto arrasta a página não rola
    const t = e.touches[0]; if (!t) return;
    if (arr) e.preventDefault();
    move(t.clientX, t.clientY);
  }, {passive: false});
  const solta = () => {
    tiraSegura(); if (!arr) return;
    cancelAnimationFrame(arr.raf); arr.el.classList.remove("arrastando"); document.body.classList.remove("modo-arrastar");
    ordens[chOrdem()] = [...$("#lista").querySelectorAll(".aluno")].map(b => +b.dataset.i);
    ls.set(CH_ORDEM, ordens); arr = null; ignoraClique = true; setTimeout(() => { ignoraClique = false; }, 350);
    $("#dicaArrastar").hidden = true; desenha();
  };
  document.addEventListener("pointerup", solta); document.addEventListener("touchend", solta); document.addEventListener("touchcancel", solta);
  document.addEventListener("pointercancel", () => { if (!arr) tiraSegura(); });
  $("#lista").addEventListener("contextmenu", e => { if (e.target.closest(".aluno")) e.preventDefault(); });

  $("#lista").addEventListener("click", e => {
    if (ignoraClique){ e.preventDefault(); return; }
    if (e.target.closest(".tel")) return;                       // o 📞 só liga, não muda a cor
    const f = e.target.closest("[data-f]"); if (f){ e.preventDefault(); abreFalta(+f.dataset.f); return; }
    const b = e.target.closest(".aluno"); if (!b) return;
    const i = +b.dataset.i;
    if (naoVai(i)){ abreFalta(i); return; }                     // cinza: abre pra desmarcar, se precisar
    if (SEMANA){ const s = new Set(est.p[diaK()] || []); s.has(i) ? s.delete(i) : s.add(i); est.p[diaK()] = [...s]; }
    else { const s = new Set(est); s.has(i) ? s.delete(i) : s.add(i); est = [...s]; }   // salva() guarda em ests[0]
    salva(); desenha();
    if (navigator.vibrate) navigator.vibrate(30);
  });

  /* ---------- "Não vai" (dias da semana que está na tela) ---------- */
  function abreFalta(i){
    const nome = dados.k[i][0], marcados = new Set(est.f[i] || []);
    const temDia = k => (dados.d[k] || []).includes(i);
    const fundo = document.createElement("div"); fundo.className = "fundo-dlg";
    fundo.innerHTML = `<div class="dlg" role="dialog" aria-modal="true" aria-label="Dias que ${esc(nome)} não vai">
      <h2>${esc(nome)} não vai em:</h2>
      <p>${sem() ? "Próxima semana" : "Esta semana"} (${String(segDa(sem()).getDate()).padStart(2, "0")}/${String(segDa(sem()).getMonth() + 1).padStart(2, "0")} a ${String(dataDo(sem() * 5 + 4).getDate()).padStart(2, "0")}/${String(dataDo(sem() * 5 + 4).getMonth() + 1).padStart(2, "0")}). No domingo a semana que passou é apagada.</p>
      <div class="chips">${DIAS.map(([k, n]) => `<button type="button" data-k="${k}" aria-pressed="${marcados.has(k)}"${temDia(k) ? "" : " disabled"}>${n.slice(0, 3).toUpperCase()}</button>`).join("")}</div>
      <div class="bts"><button type="button" data-x>Cancelar</button><button type="button" class="ok" data-ok>Salvar</button></div>
    </div>`;
    document.body.appendChild(fundo);
    fundo.addEventListener("click", e => {
      const c = e.target.closest("[data-k]");
      if (c){ const k = c.dataset.k; marcados.has(k) ? marcados.delete(k) : marcados.add(k); c.setAttribute("aria-pressed", marcados.has(k)); return; }
      if (e.target.closest("[data-ok]")){
        if (marcados.size) est.f[i] = [...marcados]; else delete est.f[i];
        DIAS.forEach(([k]) => { if (marcados.has(k) && est.p[k]) est.p[k] = est.p[k].filter(x => x !== i); });
        salva(); fundo.remove(); desenha(); return;
      }
      if (e.target === fundo || e.target.closest("[data-x]")) fundo.remove();
    });
  }

  /* ---------- trocar o dia: setas, bolinhas ou deslizar o dedo ---------- */
  const vaiPara = p => { if (!posicoes.includes(p) || p === pos) return; pos = p; est = ests[sem()]; desenha(); window.scrollTo({top: 0}); };
  const passo = dir => { const prox = dir > 0 ? posicoes.find(p => p > pos) : [...posicoes].reverse().find(p => p < pos); if (prox != null) vaiPara(prox); };
  if (SEMANA){
    $("#antes").onclick = () => passo(-1); $("#depois").onclick = () => passo(1);
    $("#bolinhas").addEventListener("click", e => { const b = e.target.closest("[data-dia]"); if (b) vaiPara(+b.dataset.dia); });
    let x0 = null, y0 = 0;
    document.addEventListener("touchstart", e => { if (e.target.closest(".fundo-dlg")) return; x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, {passive: true});
    document.addEventListener("touchend", e => { if (x0 == null) return; const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; x0 = null;
      if (Math.abs(dx) > 70 && Math.abs(dy) < 50) passo(dx < 0 ? 1 : -1); }, {passive: true});
  }

  /* quantas colunas (fica guardado neste celular) */
  let cols = 3; try { cols = +localStorage.getItem("dt-emb-colunas") || 3; } catch(e){}
  const poeCols = c => { cols = c; $("#lista").className = "c" + c; document.querySelectorAll(".cols button").forEach(b => b.setAttribute("aria-pressed", +b.dataset.c === c)); try { localStorage.setItem("dt-emb-colunas", c); } catch(e){} };
  document.querySelectorAll(".cols button").forEach(b => b.onclick = () => poeCols(+b.dataset.c));
  poeCols(cols);
  $("#recomecar").onclick = () => {
    if (!confirm(SEMANA ? `Deixar todo mundo verde de novo em ${DIAS[pos % 5][1]}? (ex.: pra volta) — quem não vai continua marcado.` : "Deixar todo mundo verde de novo? (ex.: pra volta)")) return;
    if (SEMANA) est.p[diaK()] = []; else est = [];
    salva(); desenha();
  };

  /* deixa a tela acesa enquanto a lista está aberta */
  let trava = null;
  const acende = async () => { try { if ("wakeLock" in navigator && document.visibilityState === "visible") trava = await navigator.wakeLock.request("screen"); } catch(e){} };
  document.addEventListener("visibilitychange", acende); acende();
  desenha();
})();
</script>
</body>
</html>
