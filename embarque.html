<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#712473">
<meta name="robots" content="noindex">
<title>Embarque · Danni's Tur</title>
<link rel="icon" href="icone.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@600;800&family=Kanit:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root{--roxo:#712473;--verde:#1fa855;--verde-esc:#137a3c;--verm:#d93025;--verm-esc:#9e1b13;--fundo:#f6f1f6;--tinta:#1d1320}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--fundo);color:var(--tinta);font-family:Figtree,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
  header{position:sticky;top:0;z-index:2;background:var(--roxo);color:#fff;padding:12px 16px 14px;padding-top:max(12px,env(safe-area-inset-top));box-shadow:0 4px 0 rgba(0,0,0,.15)}
  .linha{display:flex;align-items:center;justify-content:space-between;gap:10px}
  h1{margin:0;font:800 24px/1.1 Kanit,system-ui,sans-serif}
  h1 small{display:block;font:600 14px Figtree,system-ui,sans-serif;opacity:.85}
  .placar{text-align:right;font:800 30px/1 Kanit,system-ui,sans-serif;white-space:nowrap}
  .placar small{display:block;font:600 13px Figtree,system-ui,sans-serif;opacity:.85}
  .barra{margin-top:10px;height:10px;border-radius:99px;background:rgba(255,255,255,.25);overflow:hidden}
  .barra i{display:block;height:100%;width:0;background:#ffd23f;transition:width .25s}
  main{padding:14px 12px 120px;display:grid;gap:12px;grid-template-columns:1fr;max-width:980px;margin:0 auto}
  @media (min-width:700px){main{grid-template-columns:1fr 1fr}}
  .aluno{position:relative;display:flex;align-items:center;gap:14px;width:100%;min-height:96px;border:0;border-radius:20px;padding:14px 16px;text-align:left;cursor:pointer;
    background:var(--verde);color:#fff;box-shadow:0 6px 0 var(--verde-esc);transition:transform .08s,background .15s,box-shadow .15s;user-select:none}
  .aluno:active{transform:translateY(3px);box-shadow:0 3px 0 var(--verde-esc)}
  .aluno.pegou{background:var(--verm);box-shadow:0 6px 0 var(--verm-esc)}
  .aluno.pegou:active{box-shadow:0 3px 0 var(--verm-esc)}
  .num{flex:none;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.22);font:800 20px Kanit,system-ui,sans-serif}
  .txt{flex:1;min-width:0}
  .nome{display:block;font:800 clamp(24px,7.2vw,34px)/1.05 Kanit,system-ui,sans-serif;text-transform:uppercase;overflow-wrap:break-word;hyphens:none}
  .esc{display:block;margin-top:4px;font:600 15px Figtree,system-ui,sans-serif;opacity:.92}
  .estado{display:inline-block;margin-top:8px;font:800 13px Figtree,system-ui,sans-serif;letter-spacing:.04em;background:rgba(0,0,0,.2);border-radius:99px;padding:5px 10px;white-space:nowrap}
  .tel{flex:none;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:#fff;color:var(--tinta);text-decoration:none;font-size:20px}
  footer{position:fixed;left:0;right:0;bottom:0;z-index:2;display:flex;gap:10px;justify-content:center;padding:12px 16px;padding-bottom:max(12px,env(safe-area-inset-bottom));background:rgba(246,241,246,.96);border-top:1px solid #e3d6e3}
  footer button{font:800 16px Figtree,system-ui,sans-serif;border-radius:999px;padding:12px 18px;border:2px solid var(--roxo);background:#fff;color:var(--roxo);cursor:pointer}
  .vazio{grid-column:1/-1;background:#fff;border-radius:20px;padding:28px 20px;text-align:center;font-size:18px}
  .pronto{grid-column:1/-1;background:#fff8d6;border:2px solid #f0c419;border-radius:20px;padding:14px 16px;text-align:center;font:800 20px Kanit,system-ui,sans-serif}
</style>
</head>
<body>
<header>
  <div class="linha">
    <h1 id="tit">Embarque<small id="sub">Passeio do Cinema</small></h1>
    <div class="placar"><span id="cont">0/0</span><small>já pegos</small></div>
  </div>
  <div class="barra"><i id="barra"></i></div>
</header>
<main id="lista"></main>
<footer>
  <button type="button" id="recomecar">↺ Recomeçar (deixar todos verdes)</button>
</footer>
<script>
(function(){
  "use strict";
  const $ = s => document.querySelector(s);
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  /* a lista vem no próprio link (depois do #), gerado pela Área Danni's */
  let dados = null;
  try {
    const b = (location.hash.match(/[#&]d=([^&]+)/) || [])[1];
    const bin = atob(b.replace(/-/g, "+").replace(/_/g, "/"));
    dados = JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))));
  } catch(e){}
  if (!dados || !Array.isArray(dados.l)){
    $("#lista").innerHTML = `<div class="vazio">Link incompleto 😕<br><small>Peça o link da lista de embarque de novo pra Danni's Tur.</small></div>`;
    $("footer").hidden = true; return;
  }
  document.title = `Embarque · ${dados.t || "Danni's Tur"}`;
  $("#tit").firstChild.textContent = `🚐 ${dados.t || "Embarque"}`;
  $("#sub").textContent = dados.e || "Passeio do Cinema";

  /* quem já foi pego fica guardado neste celular (se fechar e abrir de novo, continua igual) */
  let h = 0; for (const c of JSON.stringify([dados.t, dados.e, dados.l.map(a => a[0])])) h = (h * 31 + c.charCodeAt(0)) | 0;
  const CHAVE = "dt-embarque-" + (h >>> 0).toString(36);
  let pegos = new Set();
  try { pegos = new Set(JSON.parse(localStorage.getItem(CHAVE) || "[]")); } catch(e){}
  const salva = () => { try { localStorage.setItem(CHAVE, JSON.stringify([...pegos])); } catch(e){} };

  function desenha(){
    const n = dados.l.length, p = dados.l.filter((a, i) => pegos.has(i)).length;
    $("#cont").textContent = `${p}/${n}`;
    $("#barra").style.width = n ? (p / n * 100) + "%" : "0";
    $("#lista").innerHTML = (p === n && n ? `<div class="pronto">🎉 Todos pegos! Bora pro cinema!</div>` : "") + dados.l.map((a, i) => {
      const [nome, escola, periodo, tel] = a, foi = pegos.has(i);
      return `<button type="button" class="aluno${foi ? " pegou" : ""}" data-i="${i}" aria-pressed="${foi}">
        <span class="num">${i + 1}</span>
        <span class="txt"><span class="nome">${esc(nome)}</span><span class="esc">${esc([escola, periodo].filter(Boolean).join(" · "))}</span><span class="estado">${foi ? "🔴 PEGOU ✔" : "🟢 FALTA PEGAR"}</span></span>
        ${tel ? `<a class="tel" href="tel:+55${esc(tel)}" title="Ligar pro responsável" aria-label="Ligar pro responsável de ${esc(nome)}">📞</a>` : ""}
      </button>`;
    }).join("");
  }
  $("#lista").addEventListener("click", e => {
    if (e.target.closest(".tel")) return;            // o 📞 só liga, não muda a cor
    const b = e.target.closest(".aluno"); if (!b) return;
    const i = +b.dataset.i;
    pegos.has(i) ? pegos.delete(i) : pegos.add(i);
    salva(); desenha();
    if (navigator.vibrate) navigator.vibrate(30);
  });
  $("#recomecar").onclick = () => { if (confirm("Deixar todo mundo verde de novo? (ex.: pra volta)")){ pegos.clear(); salva(); desenha(); } };

  /* deixa a tela acesa enquanto a lista está aberta */
  let trava = null;
  const acende = async () => { try { if ("wakeLock" in navigator && document.visibilityState === "visible") trava = await navigator.wakeLock.request("screen"); } catch(e){} };
  document.addEventListener("visibilitychange", acende); acende();
  desenha();
})();
</script>
</body>
</html>
